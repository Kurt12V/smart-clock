<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartClock</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #080808;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    min-height: 100vh;
}

.page {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
    padding: 20px 20px 50px;
}

/* ============================================================
   HEADER
   ============================================================ */

.header {
    height: 50px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid #242424;
}

.logo {
    font-size: 17px;
    font-weight: 600;
    letter-spacing: 0.12em;
}

.connection {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #666;
    font-size: 12px;
}

.connection-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #444;
}

.connection-dot.online {
    background: #54d88a;
}

/* ============================================================
   SECTIONS
   ============================================================ */

.section {
    padding: 24px 0;
    border-bottom: 1px solid #242424;
}

.section-title {
    margin-bottom: 18px;
    color: #666;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.15em;
    text-transform: uppercase;
}

/* ============================================================
   TIMEZONE
   ============================================================ */

.timezone {
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 300px;
}

.timezone-value {
    width: 100px;
    text-align: center;
    font-size: 16px;
    color: #bbb;
}

/* ============================================================
   BUTTONS
   ============================================================ */

button {
    height: 36px;
    padding: 0 14px;
    border: 1px solid #303030;
    border-radius: 5px;
    background: #111;
    color: #ddd;
    font-size: 12px;
    cursor: pointer;
    transition:
        background 0.1s,
        border-color 0.1s;
}

button:hover {
    background: #181818;
    border-color: #444;
}

button:active {
    background: #222;
}

button.primary {
    background: #eee;
    border-color: #eee;
    color: #080808;
}

button.primary:hover {
    background: #d4d4d4;
}

button.danger {
    color: #ff7070;
}

button.toggle {
    min-width: 60px;
}

button.toggle.on {
    background: #1e3a24;
    border-color: #2c5a37;
    color: #7fe0a3;
}

/* ============================================================
   RANGE
   ============================================================ */

.range-row {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 20px;
}

.range-row:last-child {
    margin-bottom: 0;
}

.range-label {
    width: 90px;
    flex-shrink: 0;
    color: #aaa;
    font-size: 12px;
}

.range-value {
    width: 45px;
    text-align: right;
    color: #666;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
}

input[type="range"] {
    flex: 1;
    width: 100%;
    height: 3px;
    margin: 0;
    padding: 0;
    appearance: none;
    -webkit-appearance: none;
    background: #303030;
    border-radius: 2px;
    outline: none;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #eee;
    cursor: pointer;
}

input[type="range"]::-moz-range-thumb {
    width: 14px;
    height: 14px;
    border: none;
    border-radius: 50%;
    background: #eee;
    cursor: pointer;
}

/* ============================================================
   SELECT
   ============================================================ */

select {
    flex: 1;
    height: 36px;
    padding: 0 12px;
    border: 1px solid #303030;
    border-radius: 5px;
    outline: none;
    background: #111;
    color: #eee;
    font-size: 12px;
    cursor: pointer;
}

select:hover {
    border-color: #444;
}

/* ============================================================
   SWITCH
   ============================================================ */

.switch-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
}

.switch-label {
    color: #aaa;
    font-size: 12px;
}

/* ============================================================
   SD
   ============================================================ */

.sd-search {
    display: flex;
    gap: 8px;
    margin-bottom: 15px;
}

input[type="text"] {
    flex: 1;
    height: 36px;
    padding: 0 12px;
    border: 1px solid #303030;
    border-radius: 5px;
    outline: none;
    background: #111;
    color: #eee;
    font-size: 12px;
}

input[type="text"]:focus {
    border-color: #555;
}

.file-list {
    max-height: 320px;
    overflow-y: auto;
}

.file {
    display: flex;
    align-items: center;
    justify-content: space-between;
    min-height: 38px;
    border-bottom: 1px solid #181818;
}

.file:last-child {
    border-bottom: none;
}

.file-path {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #aaa;
    font-size: 12px;
}

.file-size {
    flex-shrink: 0;
    margin-left: 10px;
    color: #444;
    font-size: 10px;
}

/* ============================================================
   SOUND
   ============================================================ */

.sound-buttons {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 25px;
}

.record-status {
    display: flex;
    align-items: center;
    margin-left: auto;
    color: #555;
    font-size: 11px;
}

.record-dot {
    width: 7px;
    height: 7px;
    margin-right: 7px;
    border-radius: 50%;
    background: #444;
}

.record-status.recording {
    color: #ff6b6b;
}

.record-status.recording .record-dot {
    background: #ff4d4d;
}

.audio-list {
    display: flex;
    flex-direction: column;
}

.audio-row {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 45px;
    border-bottom: 1px solid #181818;
}

.audio-name {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #aaa;
    font-size: 12px;
}

.audio-play {
    width: 38px;
    padding: 0;
}

/* ============================================================
   PLAYER
   ============================================================ */

.player-status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
    padding: 10px 14px;
    border: 1px solid #222;
    border-radius: 5px;
    background: #0c0c0c;
    font-size: 12px;
}

.player-track {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: #aaa;
}

.player-time {
    flex-shrink: 0;
    margin-left: 12px;
    color: #666;
    font-variant-numeric: tabular-nums;
}

.player-state {
    flex-shrink: 0;
    margin-left: 12px;
    padding: 2px 8px;
    border-radius: 3px;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
}

.player-state.playing {
    color: #7fe0a3;
    background: #16281b;
}

.player-state.paused {
    color: #ffd479;
    background: #2a2415;
}

.player-state.fading_out {
    color: #ff9b6b;
    background: #2a1d15;
}

.player-state.stopped {
    color: #666;
    background: #141414;
}

/* ============================================================
   EMPTY
   ============================================================ */

.empty {
    padding: 15px 0;
    color: #444;
    font-size: 12px;
}

/* ============================================================
   MESSAGE
   ============================================================ */

.message {
    position: fixed;
    left: 50%;
    bottom: 20px;
    z-index: 100;
    transform: translate(-50%, 20px);
    padding: 9px 14px;
    border: 1px solid #303030;
    border-radius: 5px;
    background: #111;
    color: #ccc;
    font-size: 12px;
    opacity: 0;
    pointer-events: none;
    transition:
        opacity 0.15s,
        transform 0.15s;
}

.message.show {
    opacity: 1;
    transform: translate(-50%, 0);
}

/* ============================================================
   MOBILE
   ============================================================ */

@media (max-width: 650px) {

    .page {
        padding: 15px 15px 40px;
    }

    .timezone {
        max-width: none;
        width: 100%;
    }

    .timezone-value {
        flex: 1;
    }
}

</style>

</head>

<div class="page">

<header class="header">

        <span

</header>


<!-- ============================================================

            <option value="3">

            <option value="4">

            <option value="5">
                Plasma

            <option value="6">
                Aurora
            </option>

            <option value="8">

            <option value="9">

</section>


<!-- ============================================================

     MESSAGE
     ============================================================ -->

<div
    id="message"
    class="message"
>
    OK
</div>


<script>

/* ============================================================
   STATE
   ============================================================ */

let files = [];

let timezoneOffset = 3;

let selectedSound = null;

let messageTimer = null;

let playerRequest = false;

let paramsRequest = false;

let sdRequest = false;

const debounceTimers = {};


/* ============================================================
   MESSAGE
   ============================================================ */

function showMessage(text) {

    const el =
        document.getElementById(
            "message"
        );

    el.textContent = text;

    el.classList.add("show");

    clearTimeout(
        messageTimer
    );

    messageTimer =
        setTimeout(
            () => {

                el.classList.remove(
                    "show"
                );

            },
            1200
        );
}


/* ============================================================
   CONNECTION
   ============================================================ */

function setConnection(online) {

    const dot =
        document.getElementById(
            "connectionDot"
        );

    const text =
        document.getElementById(
            "connectionText"
        );

    dot.classList.toggle(
        "online",
        online
    );

    text.textContent =
        online
            ? "Online"
            : "Offline";
}


/* ============================================================
   API FETCH
   ============================================================ */

async function apiFetch(
    url,
    options = {},
    timeout = 1200
) {

    const controller =
        new AbortController();

    const timer =
        setTimeout(
            () => controller.abort(),
            timeout
        );

    try {

        const response =
            await fetch(
                url,
                {
                    ...options,
                    cache: "no-store",
                    signal:
                        controller.signal
                }
            );

        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );
        }

        return response;

    } finally {

        clearTimeout(timer);

    }
}


/* ============================================================
   DEBOUNCE
   ============================================================ */

function debounce(
    name,
    callback,
    delay = 80
) {

    clearTimeout(
        debounceTimers[name]
    );

    debounceTimers[name] =
        setTimeout(
            callback,
            delay
        );
}


/* ============================================================
   SET PARAM
   ============================================================ */

async function setParam(
    name,
    value,
    silent = true
) {

    try {

        const response =
            await apiFetch(
                "/api/param",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            param: name,
                            value:
                                Number(value)
                        })
                },
                1000
            );

        const result =
            await response.json();

        if (!result.ok) {

            throw new Error(
                result.error ||
                "Parameter error"
            );
        }

        setConnection(true);

        return result;

    } catch (e) {

        setConnection(false);

        if (!silent) {

            showMessage(
                "Error: " + name
            );
        }

        return null;
    }
}


/* ============================================================
   LOAD PARAMETERS
   ============================================================ */

async function loadParams() {

    if (paramsRequest) {
        return;
    }

    paramsRequest = true;

    try {

        const response =
            await apiFetch(
                "/api/params",
                {},
                1500
            );

        const p =
            await response.json();


        /* ----------------------------------------------------
           DISPLAY
           ---------------------------------------------------- */

        setRange(
            "brightness",
            p.brightness,
            "brightness_value"
        );


        /* ----------------------------------------------------
           MATRIX
           ---------------------------------------------------- */

        applyToggle(
            "mx_on",
            p.mx_on
        );

        setRange(
            "mx_br",
            p.mx_br,
            "mx_br_value"
        );

        const matrixEffect =
            document.getElementById(
                "mx_eff"
            );

        if (
            matrixEffect &&
            p.mx_eff !== undefined
        ) {

            matrixEffect.value =
                p.mx_eff;
        }

        setRange(
            "mx_spd",
            p.mx_spd,
            "mx_spd_value"
        );



        /* ----------------------------------------------------
           COB
           ---------------------------------------------------- */

        applyToggle(
            "cob_on",
            p.cob_on
        );

        setRange(
            "cob_br",
            p.cob_br,
            "cob_br_value"
        );

        const effect =
            document.getElementById(
                "cob_eff"
            );

        if (
            effect &&
            p.cob_eff !== undefined
        ) {

            effect.value =
                p.cob_eff;
        }

        setRange(
            "cob_spd",
            p.cob_spd,
            "cob_spd_value"
        );


        /* ----------------------------------------------------
           VOLUME
           ---------------------------------------------------- */

        setRange(
            "vol_media",
            p.vol_media,
            "vol_media_value"
        );

        setRange(
            "vol_alarm",
            p.vol_alarm,
            "vol_alarm_value"
        );

        setRange(
            "vol_system",
            p.vol_system,
            "vol_system_value"
        );


        /* ----------------------------------------------------
           MICROPHONE
           ---------------------------------------------------- */

        applyToggle(
            "mic_on",
            p.mic_on
        );


        /* ----------------------------------------------------
           TIMEZONE
           ---------------------------------------------------- */

        if (
            p.utc !== undefined
        ) {

            timezoneOffset =
                Number(p.utc);

            renderTimezone();
        }


        setConnection(true);

    } catch (e) {

        setConnection(false);

    } finally {

        paramsRequest = false;

    }
}


/* ============================================================
   RANGE
   ============================================================ */

function setRange(
    id,
    value,
    valueId
) {

    const el =
        document.getElementById(id);

    if (
        !el ||
        value === undefined ||
        value === null
    ) {
        return;
    }

    el.value = value;

    if (valueId) {

        const valueEl =
            document.getElementById(
                valueId
            );

        if (valueEl) {

            valueEl.textContent =
                value + "%";
        }
    }
}


/* ============================================================
   TOGGLE
   ============================================================ */

function applyToggle(
    id,
    value
) {

    const el =
        document.getElementById(id);

    if (!el) {
        return;
    }

    const on =
        value === 1 ||
        value === true ||
        value === "1";

    el.classList.toggle(
        "on",
        on
    );

    el.textContent =
        on
            ? "ON"
            : "OFF";
}


/* ============================================================
   TIMEZONE
   ============================================================ */

function renderTimezone() {

    const sign =
        timezoneOffset >= 0
            ? "+"
            : "";

    document.getElementById(
        "timezone"
    ).textContent =
        "UTC " +
        sign +
        timezoneOffset;
}


async function changeTimezone(delta) {

    let value =
        timezoneOffset + delta;

    if (value < -12) {
        value = -12;
    }

    if (value > 14) {
        value = 14;
    }

    const oldValue =
        timezoneOffset;

    timezoneOffset =
        value;

    renderTimezone();

    const result =
        await setParam(
            "utc",
            value,
            false
        );

    if (!result) {

        timezoneOffset =
            oldValue;

        renderTimezone();

        showMessage(
            "Timezone error"
        );

        return;
    }

    showMessage(
        "Timezone changed"
    );
}

/* ============================================================
   SD
   ============================================================ */

async function loadSD() {

    if (sdRequest) {
        return;
    }

    sdRequest = true;

    const list =
        document.getElementById(
            "fileList"
        );

    list.innerHTML =
        '<div class="empty">Loading...</div>';

    try {

        const response =
            await apiFetch(
                "/api/sd",
                {},
                2500
            );

        const data =
            await response.json();

        files =
            Array.isArray(
                data.files
            )
                ? data.files
                : [];

        renderFiles();

        renderAudioFiles();

        setConnection(true);

    } catch (e) {

        list.innerHTML =
            '<div class="empty">SD unavailable</div>';

    } finally {

        sdRequest = false;

    }
}


function filterFiles() {
    renderFiles();
}


function renderFiles() {

    const list =
        document.getElementById(
            "fileList"
        );

    const input =
        document.getElementById(
            "searchInput"
        );

    const query =
        input.value
            .toLowerCase()
            .trim();

    const filtered =
        files.filter(
            f =>
                String(f.path)
                    .toLowerCase()
                    .includes(query)
        );

    if (!filtered.length) {

        list.innerHTML =
            '<div class="empty">No files</div>';

        return;
    }

    const fragment =
        document.createDocumentFragment();

    filtered.forEach(
        f => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "file";

            const path =
                document.createElement(
                    "div"
                );

            path.className =
                "file-path";

            path.textContent =
                f.path;

            const size =
                document.createElement(
                    "div"
                );

            size.className =
                "file-size";

            size.textContent =
                f.type === "dir"
                    ? "DIR"
                    : formatSize(
                        Number(
                            f.size || 0
                        )
                    );

            row.appendChild(
                path
            );

            row.appendChild(
                size
            );

            fragment.appendChild(
                row
            );
        }
    );

    list.replaceChildren(
        fragment
    );
}


function formatSize(bytes) {

    if (bytes < 1024) {

        return bytes + " B";
    }

    if (
        bytes <
        1024 * 1024
    ) {

        return (
            bytes / 1024
        ).toFixed(1) +
        " KB";
    }

    return (
        bytes /
        1024 /
        1024
    ).toFixed(1) +
    " MB";
}


/* ============================================================
   AUDIO FILES
   ============================================================ */

function renderAudioFiles() {

    const list =
        document.getElementById(
            "audioList"
        );

    const audioFiles =
        files.filter(
            f => {

                if (
                    f.type === "dir"
                ) {
                    return false;
                }

                const path =
                    String(
                        f.path
                    ).toLowerCase();

                return (
                    path.endsWith(
                        ".wav"
                    ) ||
                    path.endsWith(
                        ".mp3"
                    )
                );
            }
        );

    if (!audioFiles.length) {

        list.innerHTML =
            '<div class="empty">No sounds</div>';

        return;
    }

    const fragment =
        document.createDocumentFragment();

    audioFiles.forEach(
        f => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "audio-row";

            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "audio-name";

            name.textContent =
                f.path;

            const button =
                document.createElement(
                    "button"
                );

            button.className =
                "audio-play";

            button.textContent =
                "▶";

            button.onclick =
                () =>
                    playSound(
                        f.path
                    );

            row.appendChild(
                name
            );

            row.appendChild(
                button
            );

            fragment.appendChild(
                row
            );
        }
    );

    list.replaceChildren(
        fragment
    );
}


/* ============================================================
   PLAYER
   ============================================================ */

async function playSound(
    path,
    stream = 0
) {

    selectedSound =
        path;

    try {

        await apiFetch(
            "/api/audio/play",
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body:
                    JSON.stringify({

                        path: path,

                        stream: stream,

                        localPercent: 100,

                        fadeInMs: 0,

                        fadeOutMs: 0,

                        curve: 0
                    })
            },
            1200
        );

        setConnection(true);

        await updatePlayerStatus();

        showMessage(
            "Playing"
        );

    } catch (e) {

        showMessage(
            "Playback error"
        );
    }
}


async function playSelectedSound() {

    if (selectedSound) {

        await playSound(
            selectedSound
        );

        return;
    }

    const wav =
        files.find(
            f =>
                f.type !== "dir" &&
                String(
                    f.path
                )
                .toLowerCase()
                .endsWith(".wav")
        );

    if (!wav) {

        showMessage(
            "No WAV files"
        );

        return;
    }

    await playSound(
        wav.path
    );
}

/* ============================================================
   PLAYER STATUS
   ============================================================ */

function formatTime(ms) {

    const total =
        Math.floor(
            Number(ms || 0) /
            1000
        );

    const minutes =
        Math.floor(
            total / 60
        );

    const seconds =
        total % 60;

    return (
        minutes +
        ":" +
        String(seconds)
            .padStart(2, "0")
    );
}


async function updatePlayerStatus() {

    if (playerRequest) {
        return;
    }

    playerRequest = true;

    try {

        const response =
            await apiFetch(
                "/api/audio/status",
                {},
                700
            );

        const s =
            await response.json();


        /* ----------------------------------------------------
           TRACK
           ---------------------------------------------------- */

        document.getElementById(
            "playerTrack"
        ).textContent =
            s.path &&
            s.path.length
                ? s.path
                : "—";


        /* ----------------------------------------------------
           TIME
           ---------------------------------------------------- */

        document.getElementById(
            "playerTime"
        ).textContent =
            formatTime(
                s.positionMs
            ) +
            " / " +
            formatTime(
                s.durationMs
            );


        /* ----------------------------------------------------
           STATE
           ---------------------------------------------------- */

        const state =
            s.state ||
            "stopped";

        const stateEl =
            document.getElementById(
                "playerState"
            );

        stateEl.textContent =
            state;

        stateEl.className =
            "player-state " +
            state;

    } catch (e) {

        /* silent */

    } finally {

        playerRequest = false;
    }
}

     * и состояние аудио.

    await Promise.all([

})();

setInterval(
